<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#404D4D">
<title>논산 생산입력</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
  html, body { margin: 0; height: 100%; background: #f3f6f6; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #out { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; padding: 24px;
         font-family: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; text-align: center; color: #1d2939; }
  #out .box { background: #fff; border: 1px solid #d5dddd; border-top: 4px solid #99FF1A; border-radius: 12px; padding: 22px 18px; max-width: 360px; }
  #out img { width: 56px; height: 56px; }
  #out h1 { font-size: 18px; color: #404D4D; margin: 8px 0 12px; }
  #out p { font-size: 15px; line-height: 1.6; margin: 0 0 14px; }
  #out a { display: block; padding: 13px; border-radius: 10px; background: #404D4D; color: #fff; font-weight: 700; text-decoration: none; font-size: 16px; }
</style>
</head>
<body>
<!--
  신우에프에스 논산 생산입력 — 입구 페이지
  실제 입력기는 구글 Apps Script 웹앱이고, 이 페이지는 그것을 화면 가득 띄우기만 한다.
  · 주소가 구글이 아니라서 휴대폰 드라이브 앱이 링크를 가로채지 않고, 위쪽 Apps Script 안내 줄도 보이지 않는다
  · 로그인 유지: 입력기가 로그인/로그아웃을 알려 주면 이 페이지 저장공간에 비밀번호를 기억했다가 다음에 넘겨준다
  · 입력기 기능을 고쳐도 이 파일은 그대로 둔다. Apps Script 에서 "새 배포"로 /exec 주소가 바뀔 때만 EXEC 한 줄을 고친다
-->
<iframe id="app" title="논산 생산입력" allow="clipboard-write"></iframe>
<div id="out"><div class="box">
  <img src="icon.png" alt="">
  <h1>논산 생산입력</h1>
  <p id="outMsg"></p>
  <a id="outBtn" href="#">브라우저로 열기</a>
</div></div>
<script>
  // 메신저(카카오톡·네이버·라인·밴드·인스타 등) 안 브라우저는 입력기(구글 주소)를 불러오는 순간
  // 구글 드라이브 앱으로 넘겨 버린다. 그래서 메신저 안에서 열리면 입력기를 띄우지 않고 크롬·사파리로 넘긴다
  (function leaveInApp() {
    const ua = navigator.userAgent;
    const here = location.href;
    const isAndroid = /Android/i.test(ua), isIOS = /iPhone|iPad|iPod/i.test(ua);
    const show = (msg, href, label) => {
      document.getElementById('outMsg').innerHTML = msg;
      const b = document.getElementById('outBtn');
      if (href) { b.href = href; b.textContent = label; } else b.style.display = 'none';
      document.getElementById('out').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
    };
    if (/KAKAOTALK/i.test(ua)) {
      // 카카오톡: 바깥 브라우저로 여는 공식 주소가 있다
      const k = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(here);
      show('카카오톡 안에서는 열 수 없어 기본 브라우저로 엽니다.<br>열리지 않으면 아래 버튼을 누르세요.', k, '브라우저로 열기');
      location.href = k;
      window.STOP = true;
    } else if (/ Line\//i.test(ua)) {
      location.href = here + (here.includes('?') ? '&' : '?') + 'openExternalBrowser=1';
      window.STOP = true;
    } else if (isAndroid && /SamsungBrowser/i.test(ua)) {
      // 삼성인터넷: 페이지 안에서 불러오는 구글 주소도 드라이브 앱으로 넘기므로 크롬으로 연다
      const intent = 'intent://' + location.host + location.pathname + location.search +
        '#Intent;scheme=https;package=com.android.chrome;end';
      show('삼성인터넷에서는 입력기가 구글 드라이브로 넘어가서 크롬으로 엽니다.<br>열리지 않으면 아래 버튼을 누르세요.<br><small>(크롬에서 "홈 화면에 추가"해 두면 다음부터 바로 열립니다)</small>', intent, '크롬으로 열기');
      location.href = intent;
      window.STOP = true;
    } else if (/NAVER\(inapp|BAND\/|Instagram|FBAN|FBAV|DaumApps|everytimeApp/i.test(ua)) {
      if (isAndroid) {
        const intent = 'intent://' + location.host + location.pathname + location.search +
          '#Intent;scheme=https;package=com.android.chrome;end';
        show('이 앱 안에서는 입력기를 열 수 없습니다.<br>아래 버튼을 눌러 크롬으로 여세요.', intent, '크롬으로 열기');
        location.href = intent;
      } else if (isIOS) {
        show('이 앱 안에서는 입력기를 열 수 없습니다.<br>오른쪽 아래(또는 위) <b>⋯ 메뉴 → "Safari로 열기"</b>를 눌러 주세요.');
      } else {
        show('이 앱 안에서는 입력기를 열 수 없습니다.<br>메뉴에서 <b>"다른 브라우저로 열기"</b>를 눌러 주세요.');
      }
      window.STOP = true;
    }
  })();

  const EXEC ='https://script.google.com/macros/s/AKfycbyvLd0Tbxuoc_91hhkvSo8HfMTT3dt90DUah7PjNb46KkJrDYVlMSfnLnv4F96DAAqYYg/exec';
  const KEY = 'nonsan_pw', KEY_USER = 'nonsan_user';   // 로그인 비밀번호, 입력자 이름

  let pw = '';
  try { pw = localStorage.getItem(KEY) || ''; } catch (e) {}
  const q = new URLSearchParams(location.search).get('k');   // ?k=비밀번호 로 열면 그 값을 먼저 쓴다
  if (q) pw = q;
  const app = document.getElementById('app');
  let user = '';
  try { user = localStorage.getItem(KEY_USER) || ''; } catch (e) {}
  // entry=1: 입력기에 "입구 페이지 안에서 열렸다"고 알려 준다 (로그인·입력자 이름 기억을 이 페이지에 맡기게)
  if (!window.STOP) app.src = EXEC + '?entry=1' + (pw ? '&k=' + encodeURIComponent(pw) : '') + (user ? '&u=' + encodeURIComponent(user) : '');

  // 이 페이지에 띄운 입력기(구글 화면은 2~3겹이라 그 안쪽 어딘가)에서 온 알림만 받는다.
  // 구글 화면은 보안상 보낸 곳 주소가 'null'로 올 수 있어, 주소 대신 '내 iframe 안의 창인지'로 확인한다
  const fromApp = src => {
    try { for (let w = src, i = 0; w && i < 5; w = w.parent, i++) { if (w === app.contentWindow) return true; if (w === w.parent) break; } } catch (err) {}
    return false;
  };
  addEventListener('message', e => {
    if (!fromApp(e.source)) return;
    const d = e.data || {};
    try {
      if (d.type === 'nonsan-login' && d.pw) localStorage.setItem(KEY, d.pw);
      if (d.type === 'nonsan-logout') localStorage.removeItem(KEY);
      if (d.type === 'nonsan-user' && d.user) localStorage.setItem(KEY_USER, String(d.user).slice(0, 30));
    } catch (err) {}
  });
</script>
</body>
</html>
